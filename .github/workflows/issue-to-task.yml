name: Issue to Task

on:
  issues:
    types: [labeled]

jobs:
  add-task:
    if: github.event.label.name == 'agent-task'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - name: Append task to queue.md
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'EOF'
          import os

          number = os.environ["ISSUE_NUMBER"]
          title  = os.environ["ISSUE_TITLE"]
          body   = os.environ["ISSUE_BODY"].strip()
          task_id = f"TODO-{int(number):03d}"

          entry = f"""
## {task_id}: {title}
Status: open
Priority: medium
Issue: #{number}

Goal:
{body}

Done criteria:
- Task satisfies the goal described in the issue.

Constraints:
- Keep the diff small.
- Do not modify unrelated files.
"""
          with open("tasks/queue.md", "a") as f:
              f.write(entry)
          print(f"Appended {task_id} to tasks/queue.md")
          EOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tasks/queue.md
          git commit -m "task: add TODO-$(printf '%03d' ${{ github.event.issue.number }}) from issue #${{ github.event.issue.number }}"
          git push

      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const num = String(context.issue.number).padStart(3, '0');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `Added to [\`tasks/queue.md\`](tasks/queue.md) as \`TODO-${num}\`.`
            });
